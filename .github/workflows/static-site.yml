name: static-site

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
    inputs:
      fresh:
        description: Start from an empty database instead of the last run's
        type: boolean
        default: false

permissions:
  contents: read
  actions: write
  pages: write
  id-token: write

concurrency:
  group: static-site
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    services:
      db:
        image: postgis/postgis:17-3.5
        env:
          POSTGRES_DB: riesgo
          POSTGRES_USER: riesgo
          POSTGRES_PASSWORD: riesgo
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U riesgo -d riesgo"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 30
    env:
      DATABASE_URL: postgresql+psycopg://riesgo:riesgo@127.0.0.1:5432/riesgo
      SENAPRED_ALERTS_ENABLED: "true"
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --frozen --no-dev
      - run: uv run playwright install --with-deps chromium-headless-shell
      - id: restore
        if: ${{ !inputs.fresh }}
        uses: actions/cache/restore@v4
        with:
          path: backend/.db-cache/riesgo.dump
          key: static-site-db-${{ github.run_id }}
          restore-keys: static-site-db-
      - name: Load the last run's database
        if: steps.restore.outputs.cache-matched-key != ''
        env:
          DB_CONTAINER: ${{ job.services.db.id }}
        run: |
          docker cp .db-cache/riesgo.dump "$DB_CONTAINER":/tmp/riesgo.dump
          docker exec "$DB_CONTAINER" sh -c "pg_restore -l /tmp/riesgo.dump | grep -vE 'EXTENSION|SCHEMA - public|SCHEMA public|spatial_ref_sys' > /tmp/restore.list"
          docker exec "$DB_CONTAINER" pg_restore -U riesgo -d riesgo --no-owner --exit-on-error -L /tmp/restore.list /tmp/riesgo.dump
      - run: uv run alembic upgrade head
      - id: region
        run: uv run python -m app.cli create-region --region 07
        continue-on-error: true
      - name: Region setup failed
        if: steps.region.outcome == 'failure'
        run: echo "create-region failed; ingest continues on the restored database"
      - run: uv run python -m app.cli ingest ${{ steps.restore.outputs.cache-matched-key == '' && '--backfill' || '' }}
      - run: psql postgresql://riesgo:riesgo@127.0.0.1:5432/riesgo -c analyze
      - name: Dump the database for the next run
        env:
          DB_CONTAINER: ${{ job.services.db.id }}
        run: |
          mkdir -p .db-cache
          docker exec "$DB_CONTAINER" pg_dump -U riesgo -d riesgo -Fc --exclude-schema=tiger --exclude-schema=tiger_data --exclude-schema=topology > .db-cache/riesgo.dump
          ls -l .db-cache/riesgo.dump
      - uses: actions/cache/save@v4
        with:
          path: backend/.db-cache/riesgo.dump
          key: static-site-db-${{ github.run_id }}
      - name: Delete older database caches
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh cache list --repo "$GITHUB_REPOSITORY" --key static-site-db- --limit 100 --json key -q '.[].key'             | grep -vx "static-site-db-$GITHUB_RUN_ID"             | xargs -r -n1 gh cache delete --repo "$GITHUB_REPOSITORY"
      - run: uv run python ../tools/static-site/build.py --out ../site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
      - name: Publish to synterra.cl/maule
        id: hostinger
        continue-on-error: true
        working-directory: .
        env:
          HOSTINGER_SSH_KEY: ${{ secrets.HOSTINGER_SSH_KEY }}
          HOST: ${{ vars.HOSTINGER_HOST }}
          PORT: ${{ vars.HOSTINGER_PORT }}
          REMOTE_USER: ${{ vars.HOSTINGER_USER }}
        run: |
          install -m 700 -d ~/.ssh
          echo "$HOSTINGER_SSH_KEY" > ~/.ssh/deploy
          chmod 600 ~/.ssh/deploy
          for attempt in 1 2 3; do
            ssh-keyscan -T 15 -p "$PORT" "$HOST" > ~/.ssh/host_keys || true
            [ -s ~/.ssh/host_keys ] && break
            sleep 20
          done
          [ -s ~/.ssh/host_keys ]
          cat ~/.ssh/host_keys >> ~/.ssh/known_hosts
          rsync -az --delete -e "ssh -i ~/.ssh/deploy -p $PORT" site/ "$REMOTE_USER@$HOST:domains/synterra.cl/public_html/maule/"
      - name: Hostinger upload missed
        if: steps.hostinger.outcome == 'failure'
        run: echo "synterra.cl/maule keeps the previous version until the next run"
