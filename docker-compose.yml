name: riesgo-comunal

x-backend-env: &backend-env
  DATABASE_URL: postgresql+psycopg://riesgo:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@db:5432/riesgo
  JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
  CORS_ORIGINS: ${PUBLIC_URL:-https://localhost}
  LLM_BASE_URL: ${LLM_BASE_URL:-}
  LLM_API_KEY: ${LLM_API_KEY:-}
  LLM_MODEL: ${LLM_MODEL:-}
  EMBEDDING_BASE_URL: ${EMBEDDING_BASE_URL:-}
  EMBEDDING_API_KEY: ${EMBEDDING_API_KEY:-}
  EMBEDDING_MODEL: ${EMBEDDING_MODEL:-}
  SENAPRED_ALERTS_ENABLED: ${SENAPRED_ALERTS_ENABLED:-true}
  DMC_USER: ${DMC_USER:-}
  DMC_TOKEN: ${DMC_TOKEN:-}

services:
  db:
    build: ./deploy/db
    restart: unless-stopped
    environment:
      POSTGRES_DB: riesgo
      POSTGRES_USER: riesgo
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U riesgo -d riesgo"]
      interval: 5s
      timeout: 5s
      retries: 30

  bootstrap:
    build: ./backend
    environment:
      <<: *backend-env
      TENANT_CUT: ${TENANT_CUT:-}
      TENANT_SLUG: ${TENANT_SLUG:-}
      TENANT_NAME: ${TENANT_NAME:-}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      SEED_DEMO: ${SEED_DEMO:-false}
    command: ["python", "-m", "app.cli", "bootstrap"]
    volumes:
      - uploads:/data/uploads
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  api:
    build: ./backend
    restart: unless-stopped
    environment: *backend-env
    volumes:
      - uploads:/data/uploads
    depends_on:
      bootstrap:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health')"]
      interval: 15s
      timeout: 5s
      retries: 10

  worker:
    build: ./backend
    restart: unless-stopped
    environment: *backend-env
    command: ["python", "-m", "app.cli", "worker"]
    volumes:
      - uploads:/data/uploads
    depends_on:
      bootstrap:
        condition: service_completed_successfully

  web:
    build:
      context: ./frontend
      args:
        API_PROXY_URL: http://api:8000
    restart: unless-stopped
    depends_on:
      - api

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-localhost}
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - api
      - web

  ollama:
    image: ollama/ollama:latest
    profiles: ["local-llm"]
    restart: unless-stopped
    volumes:
      - ollama:/root/.ollama

volumes:
  db-data:
  uploads:
  caddy-data:
  caddy-config:
  ollama:
